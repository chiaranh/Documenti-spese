<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#285f78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spese">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Spese Mensili</title>
<style>
/* Layout: app a colonna singola (max 560px), barra schede in basso, cifre grandi in alto. */
:root{
  --bg:#f3f6f8; --surface:#ffffff; --ink:#18252d; --muted:#62727b; --line:#d9e2e7;
  --accent:#285f78; --accent-ink:#ffffff; --good:#285f78; --warn:#a65d16; --bad:#b3261e; --soft:#e5eef3;
  --f-display:'Avenir Next','Trebuchet MS',system-ui,sans-serif; --f-body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101a20; --surface:#18262f; --ink:#e8f0f4; --muted:#a0b2bd; --line:#2d414d;
  --accent:#75b4d0; --accent-ink:#10232d; --good:#75b4d0; --warn:#f0b36e; --bad:#ff8a80; --soft:#223945; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101a20; --surface:#18262f; --ink:#e8f0f4; --muted:#a0b2bd; --line:#2d414d;
  --accent:#75b4d0; --accent-ink:#10232d; --good:#75b4d0; --warn:#f0b36e; --bad:#ff8a80; --soft:#223945; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);padding-inline:16px;padding-block:16px 96px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,.big{font-family:var(--f-display);margin:0;text-wrap:balance}
h2{font-size:1.1rem}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ttl{text-align:center;min-width:0}
.ttl h1{font-size:1.35rem;text-transform:capitalize}
.ttl small{display:block;color:var(--muted)}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;width:40px;height:40px;font-size:1.1rem;cursor:pointer;flex:none}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.hero .lab{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.hero .big{font-size:2.6rem;line-height:1;font-weight:700}
.hero .row{display:flex;gap:20px;flex-wrap:wrap}
.hero .row div{min-width:0}
.hero .row b{display:block;font-family:var(--f-display);font-size:1.15rem}
.hero .sub{font-size:.85rem;opacity:.9}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.alertbox{background:var(--soft);border:1px solid var(--bad);border-radius:10px;padding:10px 12px;font-weight:600;font-size:.9rem}.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:380px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);min-width:0}
input,select,button,textarea{font:inherit;color:var(--ink)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input[type=checkbox]{width:22px;height:22px;padding:0;justify-self:center;accent-color:var(--accent)}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:7px 12px;font-size:.85rem}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;padding:6px 0;font-weight:500;text-align:center}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{flex:1;min-width:0}
.item .t small{display:block;color:var(--muted)}
.item .t span{overflow-wrap:anywhere}
.amt{font-weight:600;white-space:nowrap}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:4px 8px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.over{background:var(--bad)}
.bud{display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.bud:last-of-type{border-bottom:0;padding-bottom:0}
.bud .h{display:flex;justify-content:space-between;gap:8px}
.bud small{color:var(--muted)}
.tot{display:flex;justify-content:space-between;gap:8px;font-weight:600;padding-top:4px}
.pos{color:var(--good)}.neg{color:var(--bad)}.warn{color:var(--warn)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg);padding:10px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--bg);cursor:pointer;flex:none;display:grid;place-items:center;color:var(--accent-ink);padding:0}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.edit{display:grid;grid-template-columns:1fr 84px 54px 32px;gap:6px;align-items:center}
.edit.head{font-size:.72rem;color:var(--muted)}
.edit.head span:nth-child(3){text-align:center}
.edit input:not([type=checkbox]){padding:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav .in{display:flex;width:100%;max-width:560px;gap:2px;overflow-x:auto}
nav button{flex:1 0 auto;border:0;background:none;padding:10px 2px;border-radius:10px;color:var(--muted);cursor:pointer;font-weight:500;font-size:.76rem;min-width:0;white-space:nowrap}
nav button[aria-current="true"]{background:var(--soft);color:var(--accent);font-weight:600}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px}
th,td{padding:8px 6px;text-align:right;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;text-transform:capitalize}
th{font-size:.75rem;color:var(--muted);font-weight:500;border-top:0}
.muted{color:var(--muted)}
.note{font-size:.85rem;color:var(--muted);margin:0}
.center{text-align:center}
svg text{fill:var(--muted);font:11px var(--f-body)}
svg .b{fill:var(--accent)} svg .n{fill:var(--bad)} svg line.ax{stroke:var(--line)}
textarea{min-height:90px;font-size:.8rem;font-family:ui-monospace,monospace}
/* schermata di accesso */
.gate{display:flex;flex-direction:column;gap:16px;padding-top:12px}
.brand{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.brand svg{width:84px;height:84px}
.brand h1{font-size:1.7rem}
.brand p{margin:0;opacity:.9}
.pw{position:relative;display:flex}
.pw input{padding-right:84px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:6px 8px}
.msg{margin:0;font-size:.88rem;color:var(--bad)}
.msg.ok{color:var(--good)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav><div class="in" id="nav"></div></nav>
<script src="firebase-app-compat.js"></script>
<script src="firebase-auth-compat.js"></script>
<script src="firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const KEY='spese-mensili-v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const eur=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n||0);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const r2=n=>Math.round(n*100)/100;
const sum=(a,k)=>a.reduce((t,x)=>t+(+x[k]||0),0);
const clone=o=>JSON.parse(JSON.stringify(o));
const mkKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const nextKey=k=>{const[y,m]=k.split('-').map(Number);return mkKey(new Date(y,m,1))};
const prevKey=k=>{const[y,m]=k.split('-').map(Number);return mkKey(new Date(y,m-2,1))};
const monName=(y,m)=>new Date(y,m,1).toLocaleDateString('it-IT',{month:'long'});
const shortName=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('it-IT',{month:'short'}).replace('.','')};
const shortDate=d=>d.getDate()+' '+d.toLocaleDateString('it-IT',{month:'short'}).replace('.','');

/* ---- Periodo: dal giorno dello stipendio (default 16) al giorno prima del mese dopo ---- */
const startDay=()=>Math.min(28,Math.max(1,(S.settings&&S.settings.startDay)||16));
function curKey(){const d=new Date(),k=mkKey(d);return d.getDate()>=startDay()?k:prevKey(k)}
function periodTitle(k){const[y,m]=k.split('-').map(Number);return startDay()===1?monName(y,m-1):monName(y,m-1)+' / '+monName(y,m)}
function periodLabel(k){
  const[y,m]=k.split('-').map(Number),sd=startDay(),a=new Date(y,m-1,sd),b=new Date(y,m,sd-1);
  return shortDate(a)+' – '+shortDate(b)+' '+b.getFullYear();
}
function dueDate(f,k){
  if(!f.day)return null;
  const[y,mo]=k.split('-').map(Number),first=f.day>=startDay(),base=new Date(y,mo-1+(first?0:1),1);
  const last=new Date(base.getFullYear(),base.getMonth()+1,0).getDate();
  return new Date(base.getFullYear(),base.getMonth(),Math.min(f.day,last));
}

/* ---- Dati ---- */
function norm(o){
  o.settings=Object.assign({startDay:16,name:''},o.settings||{});
  const fix=a=>(a||[]).forEach(b=>{if(b.save===undefined)b.save=/da parte|risparm/i.test(b.name)});
  fix(o.tpl.budgets);Object.values(o.months).forEach(m=>{fix(m.budgets);if(!Array.isArray(m.savings))m.savings=[]});
  return o;
}
function seed(){
  const k=mkKey(new Date());
  return norm({tpl:{fixed:[],budgets:[]},months:{[curKeyFor(k)]:{salary:0,carry:0,cash:0,fixed:[],budgets:[],paid:{},exp:[]}}});
}
function curKeyFor(k){const d=new Date();return d.getDate()>=16?k:prevKey(k)}
function load(){try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);if(o&&o.months&&o.tpl)return norm(o)}}catch(e){}return seed()}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){S._ts=Date.now();saveLocal();schedulePush()}
let S=load();
let cur=curKey(),tab='riepilogo',method='card',msg='',gateMode='login',lastEmail='',lastName='';

function ensure(k){
  if(S.months[k])return S.months[k];
  const p=S.months[prevKey(k)];
  S.months[k]={salary:p?p.salary:0,carry:0,carryAuto:!!p,cash:0,fixed:clone(S.tpl.fixed),budgets:clone(S.tpl.budgets),paid:{},exp:[],savings:[]};
  if(p)S.months[k].carry=r2(calc(p).avanzo);
  saveLocal();return S.months[k];
}
function syncCarry(k){
  const m=S.months[k],pk=prevKey(k),p=S.months[pk];
  if(!m||!p)return;
  syncCarry(pk);
  if(m.carryAuto){const v=r2(calc(p).avanzo);if(v!==m.carry){m.carry=v;saveLocal()}}
}
function calc(m){
  const disp=m.salary+m.carry,fixed=sum(m.fixed,'amount');
  const paidFixed=m.fixed.filter(f=>m.paid[f.id]).reduce((t,f)=>t+f.amount,0);
  const spent={};let extra=0,cashSp=0,cardSp=0;
  m.exp.forEach(e=>{
    if(e.cat&&m.budgets.some(b=>b.id===e.cat))spent[e.cat]=(spent[e.cat]||0)+e.amount;else extra+=e.amount;
    if(e.method==='cash')cashSp+=e.amount;else cardSp+=e.amount;});
  let planned=extra,actual=extra,restTot=0,spentTot=0,budTot=0;
  m.budgets.forEach(b=>{const s=spent[b.id]||0;
    planned+=Math.max(b.amount,s);
    actual+=b.save?Math.max(b.amount,s):s;
    restTot+=b.amount-s;spentTot+=s;budTot+=b.amount});
  const sav=m.savings||[];
  const savCardNet=sum(sav.filter(x=>x.method==='card').map(x=>({v:(x.kind==='withdraw'?-1:1)*x.amount})),'v');
  const savCashNet=sum(sav.filter(x=>x.method==='cash').map(x=>({v:(x.kind==='withdraw'?-1:1)*x.amount})),'v');
  const savingsNet=sum(sav.map(x=>({v:(x.kind==='withdraw'?-1:1)*x.amount})),'v');
  const cardNow=disp-paidFixed-m.cash-cardSp-savCardNet,unpaid=fixed-paidFixed;
  const cashLeft=m.cash-cashSp-savCashNet;
  return{disp,fixed,paidFixed,unpaid,spent,extra,cashSp,cardSp,cardNow,cashLeft,
    afterFixed:cardNow-unpaid,avanzo:disp-fixed-actual-savingsNet,previsto:disp-fixed-planned,
    restTot,spentTot,budTot,savingsNet,savCardNet,savCashNet};
}
const cls=n=>n<0?'neg':'pos';
const val=id=>{const e=document.getElementById(id);return e?e.value:''};

/* ---- Schermate ---- */
function header(){
  const hello=S.settings.name?'Ciao '+S.settings.name+' · ':'';
  return`<div class="top"><button class="iconbtn" data-a="prev" aria-label="Periodo precedente">‹</button>
    <div class="ttl"><h1>${esc(periodTitle(cur))}</h1><small>${esc(hello)}${esc(periodLabel(cur))}</small></div>
    <button class="iconbtn" data-a="next" aria-label="Periodo successivo">›</button></div>
    ${cur!==curKey()?'<button class="btn ghost small" data-a="today">Torna al periodo attuale</button>':''}`;
}
function view(){
  const m=ensure(cur);syncCarry(cur);const c=calc(m);
  if(tab==='storico')return storico();
  if(tab==='risparmi')return risparmi();
  if(tab==='account')return account();
  if(tab==='spese')return header()+spese(m,c);
  if(tab==='fisse')return header()+fisse(m,c);
  return header()+riepilogo(m,c);
}
function riepilogo(m,c){
  const buds=m.budgets.map(b=>{const s=c.spent[b.id]||0,rest=b.amount-s,p=b.amount?Math.min(100,s/b.amount*100):0;
    return`<div class="bud"><div class="h"><span>${esc(b.name)}</span><span class="num">${eur(s)} <small>/ ${eur(b.amount)}</small></span></div>
    <div class="bar"><i class="${s>b.amount?'over':''}" style="width:${p}%"></i></div>
    <div class="h"><small>${b.save?'Accantonato per intero':'Conta solo quanto spendi'}</small>
    <b class="num ${rest<0?'neg':'pos'}">${rest<0?'Sforato di '+eur(-rest):'Residuo '+eur(rest)}</b></div></div>`}).join('');
  const nextExists=!!S.months[nextKey(cur)];
  const carryNote=m.carryAuto?'Aggiornato in automatico':(S.months[prevKey(cur)]?'<button class="linkbtn" data-a="carryauto">Usa l\'avanzo automatico</button>':'');
  const savingsTotal=Object.values(S.months).reduce((t,x)=>t+sum((x.savings||[]).map(v=>({v:(v.kind==='withdraw'?-1:1)*v.amount})),'v'),0);
  return`<section class="hero"><div><div class="lab">Soldi utilizzabili dopo le spese previste</div><div class="big num">${eur(c.avanzo)}</div>
    <div class="sub">Budget del periodo: ${eur(c.disp)} · Spese fisse previste: ${eur(c.fixed)}</div></div>
    <div class="row"><div><span class="lab">Su carta</span><b class="num">${eur(c.cardNow)}</b></div>
    <div><span class="lab">Contanti</span><b class="num">${eur(c.cashLeft)}</b></div>
    <div><span class="lab">Fisse da pagare</span><b class="num">${eur(c.unpaid)}</b></div></div>
    ${c.afterFixed<0?`<div class="alertbox" role="alert">Attenzione: sulla carta mancano ${eur(-c.afterFixed)} per coprire le spese fisse ancora da pagare.</div>`:`<div class="sub">Dopo le spese fisse non ancora pagate, su carta restano ${eur(c.afterFixed)}.</div>`}
  </section>
  <section class="card"><h2>Budget del periodo</h2><div class="grid2">
    <label class="f" for="in-sal">Stipendio<input id="in-sal" inputmode="decimal" data-f="salary" value="${m.salary}"></label>
    <label class="f" for="in-car">Avanzo precedente<input id="in-car" inputmode="decimal" data-f="carry" value="${m.carry}"></label>
    <label class="f" for="in-cash">Trasferiti da carta a contanti<input id="in-cash" inputmode="decimal" data-f="cash" value="${m.cash}"></label>
    <label class="f">Budget totale disponibile<input value="${eur(c.disp)}" disabled aria-label="Budget totale disponibile"></label></div>
    ${carryNote?`<p class="note">${carryNote}</p>`:''}
    <p class="note">Il prelievo è un trasferimento tra carta e contanti, non una spesa aggiuntiva. Le spese vengono conteggiate quando le registri.</p></section>
  <section class="card"><div class="sectionhead"><h2>Budget per categoria</h2><span class="num">${eur(c.budTot)}</span></div>${buds||'<p class="note">Nessuna categoria. Aggiungile dalla scheda Fisse.</p>'}
    ${m.budgets.length?`<div class="tot"><span>Residuo dei budget</span><span class="num ${cls(c.restTot)}">${eur(c.restTot)}</span></div>
    <p class="note">Speso ${eur(c.spentTot)} su ${eur(c.budTot)}. Le spese fisse ancora da pagare sono ${eur(c.unpaid)}.</p>`:''}</section>
  <section class="card"><div class="sectionhead"><h2>Salvadanaio</h2><span class="num">${eur(savingsTotal)}</span></div>
    <p class="note">Somma messa da parte nei vari periodi. I trasferimenti al salvadanaio riducono i soldi utilizzabili, senza essere conteggiati come spese.</p>
    <button class="btn ghost" data-tab="risparmi">Apri salvadanaio</button></section>
  <section class="card"><h2>Periodo successivo</h2>
    <p class="note">L'avanzo attuale (${eur(c.avanzo)}) verrà proposto come avanzo del periodo successivo.</p>
    <button class="btn" data-a="close">${nextExists?'Vai al periodo successivo':'Apri '+esc(periodTitle(nextKey(cur)))}</button></section>`;
}
function spese(m,c){
  const opts=m.budgets.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')+'<option value="">Altro (fuori categoria)</option>';
  const items=[...m.exp].reverse().map(e=>{const b=m.budgets.find(x=>x.id===e.cat);
    const dt=e.date?shortDate(new Date(e.date+'T12:00:00'))+' · ':'';
    return`<div class="item"><div class="t"><span>${esc(e.desc||'Spesa')}</span><small>${dt}${b?esc(b.name):'Altro'} · ${e.method==='cash'?'contanti':'carta'}</small></div>
    <span class="amt num">${eur(e.amount)}</span><button class="x" data-a="delexp" data-id="${e.id}" aria-label="Elimina spesa">✕</button></div>`}).join('');
  return`<section class="card"><h2>Nuova spesa</h2>
    <label class="f" for="ex-d">Descrizione<input id="ex-d" placeholder="es. Caffè"></label>
    <div class="grid2"><label class="f" for="ex-a">Importo (€)<input id="ex-a" inputmode="decimal" placeholder="0,00"></label>
    <label class="f" for="ex-c">Categoria<select id="ex-c">${opts}</select></label></div>
    <div class="seg" role="group" aria-label="Metodo di pagamento"><button data-a="m" data-m="card" aria-pressed="${method==='card'}">Carta</button>
    <button data-a="m" data-m="cash" aria-pressed="${method==='cash'}">Contanti</button></div>
    <button class="btn" data-a="addexp">Aggiungi spesa</button>${msg?`<p class="note">${esc(msg)}</p>`:''}</section>
  <section class="card"><h2>Spese del periodo <span class="muted num">· ${eur(sum(m.exp,'amount'))}</span></h2>
    <div class="list">${items||'<p class="note">Ancora nessuna spesa registrata in questo periodo.</p>'}</div></section>`;
}
function dueText(f,m){
  const d=dueDate(f,cur);
  if(!d)return m.paid[f.id]?'Pagata':'Data libera';
  if(m.paid[f.id])return'Pagata · '+shortDate(d);
  if(cur!==curKey())return'Entro il '+shortDate(d);
  const t=new Date();t.setHours(0,0,0,0);
  const diff=Math.round((d-t)/864e5);
  return diff<0?`Scaduta da ${-diff} gg`:diff===0?'Scade oggi':`Il ${shortDate(d)} · tra ${diff} gg`;
}
function fisse(m,c){
  const sorted=[...m.fixed].sort((a,b)=>{const x=dueDate(a,cur),y=dueDate(b,cur);return (x?x.getTime():9e15)-(y?y.getTime():9e15)});
  const rows=sorted.map(f=>`<div class="item"><button class="check" data-a="pay" data-id="${f.id}" aria-pressed="${!!m.paid[f.id]}" aria-label="Segna ${esc(f.name)} come pagata">${m.paid[f.id]?'✓':''}</button>
    <div class="t"><span>${esc(f.name)}</span><small>${dueText(f,m)}</small></div><span class="amt num">${eur(f.amount)}</span></div>`).join('');
  const ed=(arr,kind)=>arr.map(x=>`<div class="edit"><input data-k="${kind}" data-id="${x.id}" data-p="name" value="${esc(x.name)}" aria-label="Nome">
    <input data-k="${kind}" data-id="${x.id}" data-p="amount" inputmode="decimal" value="${x.amount}" aria-label="Importo">
    ${kind==='fixed'?`<input data-k="${kind}" data-id="${x.id}" data-p="day" inputmode="numeric" value="${x.day||''}" placeholder="gg" aria-label="Giorno del mese">`
      :`<input type="checkbox" data-k="${kind}" data-id="${x.id}" data-p="save" ${x.save?'checked':''} aria-label="Accantona per intero">`}
    <button class="x" data-a="deli" data-k="${kind}" data-id="${x.id}" aria-label="Rimuovi">✕</button></div>`).join('');
  return`<section class="card"><h2>Da pagare in questo periodo</h2><div class="list">${rows||'<p class="note">Nessuna spesa fissa. Aggiungile qui sotto.</p>'}</div>
    <p class="note">Pagate ${eur(c.paidFixed)} · restano ${eur(c.unpaid)}</p></section>
  <section class="card"><h2>Modifica spese fisse</h2><p class="note">Nome, importo e giorno del mese. Le modifiche valgono da questo periodo in poi.</p>
    <div class="edit head"><span>Nome</span><span>Importo</span><span>Giorno</span><span></span></div>
    ${ed(m.fixed,'fixed')}<button class="btn ghost small" data-a="addi" data-k="fixed">+ Spesa fissa</button></section>
  <section class="card"><h2>Modifica categorie</h2>
    <p class="note">Spunta "Accantona" per le categorie che metti da parte per intero (come "Da parte"). Le altre contano nell'avanzo solo per quanto spendi.</p>
    <div class="edit head"><span>Nome</span><span>Budget</span><span>Accantona</span><span></span></div>
    ${ed(m.budgets,'budgets')}<button class="btn ghost small" data-a="addi" data-k="budgets">+ Categoria</button></section>`;
}
function risparmi(){
  const m=ensure(cur);
  const all=Object.values(S.months).flatMap(x=>x.savings||[]);
  const balance=all.reduce((t,x)=>t+(x.kind==='withdraw'?-1:1)*x.amount,0);
  const rows=[...(m.savings||[])].reverse().map(x=>`<div class="item"><div class="t"><span>${x.kind==='withdraw'?'Prelievo dal salvadanaio':'Accantonamento'}${x.note?' · '+esc(x.note):''}</span><small>${x.method==='cash'?'Contanti':'Carta'} · ${esc(x.date||'')}</small></div><span class="amt num ${x.kind==='withdraw'?'pos':''}">${x.kind==='withdraw'?'+':'−'}${eur(x.amount)}</span><button class="x" data-a="delsave" data-id="${x.id}" aria-label="Elimina movimento">✕</button></div>`).join('');
  return`${header()}
  <section class="hero"><div><div class="lab">Salvadanaio totale</div><div class="big num">${eur(balance)}</div></div>
    <div class="sub">I movimenti vengono registrati nel periodo selezionato. Puoi accantonare denaro dalla carta o dai contanti.</div></section>
  <section class="card"><h2>Nuovo movimento</h2>
    <label class="f" for="sav-amount">Importo (€)<input id="sav-amount" inputmode="decimal" placeholder="0,00"></label>
    <div class="grid2"><label class="f" for="sav-kind">Operazione<select id="sav-kind"><option value="deposit">Metti da parte</option><option value="withdraw">Riprendi dal salvadanaio</option></select></label>
    <label class="f" for="sav-method">Da / verso<select id="sav-method"><option value="card">Carta</option><option value="cash">Contanti</option></select></label></div>
    <label class="f" for="sav-note">Nota (facoltativa)<input id="sav-note" placeholder="es. Vacanze, emergenze…"></label>
    <button class="btn" data-a="addsave">Registra movimento</button>
    ${msg?`<p class="note">${esc(msg)}</p>`:''}</section>
  <section class="card"><h2>Movimenti del periodo</h2><div class="list">${rows||'<p class="note">Nessun movimento nel salvadanaio in questo periodo.</p>'}</div></section>
  <p class="note">Eliminare un movimento aggiorna anche il saldo del salvadanaio e il saldo della carta o dei contanti associati.</p>`;
}

function storico(){
  const keys=Object.keys(S.months).sort();
  const data=keys.map(k=>({k,...calc(S.months[k]),m:S.months[k]}));
  const W=Math.max(300,data.length*64),H=160,pad=24,mx=Math.max(1,...data.map(d=>Math.abs(d.avanzo))),zero=H/2;
  const bars=data.map((d,i)=>{const h=Math.abs(d.avanzo)/mx*(H/2-pad),x=i*64+16,y=d.avanzo>=0?zero-h:zero;
    return`<rect class="${d.avanzo>=0?'b':'n'}" x="${x}" y="${y}" width="32" height="${Math.max(1,h)}" rx="4"/>
    <text x="${x+16}" text-anchor="middle" y="${d.avanzo>=0?y-6:y+h+14}">${Math.round(d.avanzo)}</text>
    <text x="${x+16}" text-anchor="middle" y="${H+16}">${shortName(d.k)}</text>`}).join('');
  const lab=k=>startDay()===1?shortName(k):shortName(k)+'/'+shortName(nextKey(k));
  const rows=data.map(d=>`<tr><td>${esc(lab(d.k))}</td><td class="num">${eur(d.disp)}</td><td class="num">${eur(d.fixed)}</td>
    <td class="num">${eur(sum(d.m.exp,'amount'))}</td><td class="num ${cls(d.avanzo)}">${eur(d.avanzo)}</td></tr>`).join('');
  const tot=data.reduce((t,d)=>t+d.avanzo,0);
  return`<div class="top"><h1>Storico</h1></div>
  <section class="card"><h2>Avanzo periodo per periodo</h2><div class="scroll"><svg viewBox="0 0 ${W} ${H+24}" width="${W}" height="${H+24}" role="img" aria-label="Avanzo per periodo">
    <line class="ax" x1="0" x2="${W}" y1="${zero}" y2="${zero}"/>${bars}</svg></div>
    <p class="note">Somma degli avanzi: <b class="num ${cls(tot)}">${eur(tot)}</b></p></section>
  <section class="card"><h2>Dettaglio</h2><div class="scroll"><table><thead><tr><th>Periodo</th><th>Disponibile</th><th>Fisse</th><th>Spese</th><th>Avanzo</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}
function account(){
  const cloud=cloudOn()&&user;
  return`<div class="top"><h1>Account</h1></div>
  <section class="card"><h2>Profilo</h2>
    <label class="f" for="acc-name">Il tuo nome<input id="acc-name" data-s="name" value="${esc(S.settings.name||'')}" placeholder="Come ti chiami?" autocomplete="given-name"></label>
    ${cloud?`<div><span class="note">Email</span><div>${esc(user.email||'')}</div></div>
    <p class="note">${esc(syncMsg||'')}</p><button class="btn ghost small" data-a="logout">Esci</button>`
    :`<p class="note">${cloudOn()?'':'La sincronizzazione online non è attiva: i dati restano su questo dispositivo.'}</p>`}</section>
  <section class="card"><h2>Periodo di spesa</h2>
    <label class="f" for="acc-day">Giorno dello stipendio<input id="acc-day" data-s="startDay" inputmode="numeric" value="${startDay()}"></label>

}

/* ---- Account e sincronizzazione (Firebase) ---- */
let fb=null,user=null,authReady=false,syncMsg='',unsub=null,pushTimer=null;
const cloudOn=()=>typeof firebase!=='undefined'&&typeof FIREBASE_CONFIG!=='undefined'&&!!FIREBASE_CONFIG.apiKey&&!/INCOLLA/.test(FIREBASE_CONFIG.apiKey);
const hhmm=()=>new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
const isEditing=()=>{const e=document.activeElement;return !!e&&/^(INPUT|TEXTAREA|SELECT)$/.test(e.tagName)};
function initCloud(){
  if(!cloudOn())return;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    fb={auth:firebase.auth(),db:firebase.firestore()};
    fb.db.settings({experimentalAutoDetectLongPolling:true,merge:true});
    fb.auth.onAuthStateChanged(u=>{
      user=u;authReady=true;msg='';
      if(unsub){unsub();unsub=null}
      if(u)startSync();else render();
    });
  }catch(e){authReady=true;fb=null;render()}
}
const docRef=()=>fb.db.collection('users').doc(user.uid);
function startSync(){
  syncMsg='Connessione…';render();
  unsub=docRef().onSnapshot(snap=>{
    if(!snap.exists){
      if(snap.metadata.fromCache){syncMsg='Offline: modifiche salvate sul dispositivo';refresh();return}
      push();return;
    }
    const d=snap.data(),remoteTs=d.ts||0,localTs=S._ts||0;
    if(remoteTs>localTs){
      try{S=norm(JSON.parse(d.state));S._ts=remoteTs;saveLocal();cur=S.months[cur]?cur:curKey();ensure(cur);syncMsg='Sincronizzato alle '+hhmm();refresh()}catch(e){}
    }else if(localTs>remoteTs){push()}
    else{syncMsg=snap.metadata.fromCache?'Offline: dati salvati sul dispositivo':'Sincronizzato alle '+hhmm();refresh()}
  },()=>{syncMsg='Offline: modifiche salvate sul dispositivo';refresh()});
}
function refresh(){if(!isEditing())render()}
function schedulePush(){if(!fb||!user)return;clearTimeout(pushTimer);pushTimer=setTimeout(push,700)}
function push(){
  if(!fb||!user)return;
  if(!S._ts){S._ts=Date.now();saveLocal()}
  docRef().set({state:JSON.stringify(S),ts:S._ts}).then(()=>{syncMsg='Sincronizzato alle '+hhmm();refresh()}).catch(()=>{syncMsg='Offline: modifiche salvate sul dispositivo';refresh()});
}
window.addEventListener('online',()=>{if(fb&&user)push()});
function authErr(e){
  const c=(e&&e.code)||'';
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return'Email o password non corrette.';
  if(c==='auth/email-already-in-use')return'Esiste già un account con questa email. Usa Accedi.';
  if(c==='auth/invalid-email')return'Email non valida.';
  if(c==='auth/weak-password')return'La password deve avere almeno 6 caratteri.';
  if(c==='auth/network-request-failed')return'Nessuna connessione. Riprova quando sei online.';
  if(c==='auth/too-many-requests')return'Troppi tentativi. Riprova tra qualche minuto.';
  return'Errore di accesso'+(c?' ('+c+')':'')+'.';
}
function authAction(a){
  if(!fb)return;
  if(a==='logout'){fb.auth.signOut();return}
  const em=val('lg-mail').trim(),pw=val('lg-pw'),nm=val('lg-name').trim();
  lastEmail=em;lastName=nm;
  if(!em){msg='Inserisci la tua email.';render();return}
  if(a==='reset'){
    fb.auth.sendPasswordResetEmail(em).then(()=>{msg='ok:Ti ho inviato una mail per reimpostare la password.';render()}).catch(e=>{msg=authErr(e);render()});return}
  if(!pw){msg='Inserisci la password.';render();return}
  if(a==='signup'&&pw.length<6){msg='La password deve avere almeno 6 caratteri.';render();return}
  msg='ok:Accesso in corso…';render();
  if(a==='signup'){
    fb.auth.createUserWithEmailAndPassword(em,pw).then(()=>{if(nm){S.settings.name=nm;save()}}).catch(e=>{msg=authErr(e);render()});
  }else{
    fb.auth.signInWithEmailAndPassword(em,pw).catch(e=>{msg=authErr(e);render()});
  }
}
const LOGO=`<svg viewBox="-3 3 106 90" role="img" aria-label="Salvadanaio" xmlns="http://www.w3.org/2000/svg"><ellipse cx="46" cy="55" rx="30" ry="22" fill="var(--accent-ink)"/><ellipse cx="78" cy="54" rx="9" ry="7.5" fill="var(--accent-ink)"/><path d="M60 38 L64 26 Q65.5 22.5 69 25 L75 42 Z" fill="var(--accent-ink)"/><rect x="27" y="68" width="10" height="17" rx="4" fill="var(--accent-ink)"/><rect x="55" y="68" width="10" height="17" rx="4" fill="var(--accent-ink)"/><path d="M17 50 Q7 49 8 41 Q9 36 14 38" fill="none" stroke="var(--accent-ink)" stroke-width="4" stroke-linecap="round"/><circle cx="66" cy="49" r="2.8" fill="var(--accent)"/><circle cx="76" cy="53" r="1.4" fill="var(--accent)"/><circle cx="81" cy="53" r="1.4" fill="var(--accent)"/><rect x="38" y="33.5" width="18" height="3.4" rx="1.7" fill="var(--accent)"/><circle cx="47" cy="17" r="10" fill="#ffd166"/><circle cx="47" cy="17" r="6" fill="none" stroke="var(--accent)" stroke-width="1.6" opacity=".55"/></svg>`;
function loginView(){
  const su=gateMode==='signup';
  const m=msg.startsWith('ok:')?`<p class="msg ok" role="status">${esc(msg.slice(3))}</p>`:msg?`<p class="msg" role="alert">${esc(msg)}</p>`:'';
  return`<div class="gate"><section class="brand">${LOGO}<h1>Spese Mensili</h1><p>Il tuo budget, da stipendio a stipendio.</p></section>
  <form class="card" id="gate-form" novalidate>
    <div class="seg" role="group" aria-label="Modalità"><button type="button" data-a="mode" data-m="login" aria-pressed="${!su}">Accedi</button>
    <button type="button" data-a="mode" data-m="signup" aria-pressed="${su}">Crea account</button></div>
    ${su?`<label class="f" for="lg-name">Come ti chiami?<input id="lg-name" autocomplete="given-name" value="${esc(lastName)}"></label>`:''}
    <label class="f" for="lg-mail">Email<input id="lg-mail" type="email" inputmode="email" autocomplete="username" autocapitalize="off" value="${esc(lastEmail)}"></label>
    <label class="f" for="lg-pw">Password<span class="pw"><input id="lg-pw" type="password" autocomplete="${su?'new-password':'current-password'}"><button type="button" data-a="showpw">Mostra</button></span></label>
    <button class="btn" type="submit">${su?'Crea account':'Accedi'}</button>
    ${su?'<p class="note">Almeno 6 caratteri.</p>':'<button type="button" class="linkbtn" data-a="reset">Password dimenticata?</button>'}
    ${m}</form>
  <p class="note center">I tuoi dati restano sul dispositivo e si sincronizzano con il tuo account.</p></div>`;
}

/* ---- Render ---- */
function render(){
  const app=document.getElementById('app'),navBox=document.querySelector('nav');
  if(cloudOn()&&!authReady){app.innerHTML='<p class="note center">Caricamento…</p>';navBox.hidden=true;return}
  if(cloudOn()&&!user){app.innerHTML=loginView();navBox.hidden=true;return}
  navBox.hidden=false;
  app.innerHTML=view();
  const T=[['riepilogo','Riepilogo'],['spese','Spese'],['fisse','Fisse'],['risparmi','Salvadanaio'],['storico','Storico'],['account','Account']];
  document.getElementById('nav').innerHTML=T.map(([k,l])=>`<button data-tab="${k}" ${tab===k?'aria-current="true"':''}>${l}</button>`).join('');
}
function edit(kind,id,fn){
  if(kind==='fixed'){
    Object.keys(S.months).filter(k=>k>=cur).sort().forEach(k=>{const x=S.months[k].fixed.find(i=>i.id===id);if(x)fn(x)});
    const t=S.tpl.fixed.find(i=>i.id===id);if(t)fn(t);
  }else{
    [S.months[cur][kind],S.tpl[kind]].forEach(a=>{const x=a.find(i=>i.id===id);if(x)fn(x)});
  }
}
document.addEventListener('submit',ev=>{if(ev.target.id==='gate-form'){ev.preventDefault();authAction(gateMode==='signup'?'signup':'login')}});
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-a],[data-tab]');if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;msg='';render();window.scrollTo(0,0);return}
  const a=t.dataset.a;
  if(a==='mode'){lastEmail=val('lg-mail');lastName=val('lg-name');gateMode=t.dataset.m;msg='';render();return}
  if(a==='showpw'){const i=document.getElementById('lg-pw');i.type=i.type==='password'?'text':'password';t.textContent=i.type==='password'?'Mostra':'Nascondi';return}
  if(a==='reset'||a==='logout'){authAction(a);return}
  const m=S.months[cur],id=t.dataset.id;
  if(a==='prev'){cur=prevKey(cur);ensure(cur)}
  else if(a==='next'){cur=nextKey(cur);ensure(cur)}
  else if(a==='today'){cur=curKey();ensure(cur)}
  else if(a==='close'){const n=nextKey(cur);ensure(n);cur=n;window.scrollTo(0,0)}
  else if(a==='carryauto'){m.carryAuto=true}
  else if(a==='m'){method=t.dataset.m}
  else if(a==='addexp'){
    const amount=num(document.getElementById('ex-a').value);
    if(!amount){msg='Inserisci un importo.';render();return}
    m.exp.push({id:uid(),desc:document.getElementById('ex-d').value.trim(),amount,cat:document.getElementById('ex-c').value,method,date:new Date().toISOString().slice(0,10)});
    msg='Spesa aggiunta.';save();render();document.getElementById('ex-d').focus();return}
  else if(a==='delexp'){m.exp=m.exp.filter(e=>e.id!==id)}
  else if(a==='addsave'){
    const amount=num(val('sav-amount')),kind=val('sav-kind'),method=val('sav-method'),note=val('sav-note').trim();
    if(amount<=0){msg='Inserisci un importo maggiore di zero.';render();return}
    const all=Object.values(S.months).flatMap(x=>x.savings||[]);
    const balance=all.reduce((t,x)=>t+(x.kind==='withdraw'?-1:1)*x.amount,0);
    if(kind==='withdraw'&&amount>balance){msg='Il prelievo supera il saldo del salvadanaio.';render();return}
    m.savings=m.savings||[];m.savings.push({id:uid(),amount:r2(amount),kind,method,note,date:new Date().toISOString().slice(0,10)});
    msg='Movimento registrato.';save();render();return}
  else if(a==='delsave'){m.savings=(m.savings||[]).filter(x=>x.id!==id)}
  else if(a==='pay'){m.paid[id]=!m.paid[id]}
  else if(a==='deli'){const k=t.dataset.k;
    if(k==='fixed'){Object.keys(S.months).filter(key=>key>=cur).forEach(key=>S.months[key].fixed=S.months[key].fixed.filter(i=>i.id!==id))}
    else m[k]=m[k].filter(i=>i.id!==id);
    S.tpl[k]=S.tpl[k].filter(i=>i.id!==id)}
  else if(a==='addi'){const k=t.dataset.k,it=k==='fixed'?{id:uid(),name:'Nuova spesa',amount:0,day:0}:{id:uid(),name:'Nuova categoria',amount:0,save:false};
    if(k==='fixed'){Object.keys(S.months).filter(key=>key>=cur).forEach(key=>S.months[key].fixed.push({...it}))}
    else m[k].push(it);
    S.tpl[k].push({...it})}
  else if(a==='copy'){const ta=document.getElementById('bk');ta.value=JSON.stringify(S);ta.select();
    try{await navigator.clipboard.writeText(ta.value);msg='Dati copiati.'}catch(e){msg='Testo selezionato: copialo a mano.'}
    render();document.getElementById('bk').value=JSON.stringify(S);return}
  else if(a==='imp'){try{const o=JSON.parse(document.getElementById('bk').value);
    if(!o||!o.months||!o.tpl)throw 0;S=norm(o);cur=curKey();ensure(cur);msg='Dati ripristinati.'}catch(e){msg='Testo non valido.'}}
  if(!['m','prev','next','today'].includes(a))save();
  if(a!=='copy'&&a!=='imp')msg=a==='addexp'?msg:'';
  render();
});
document.addEventListener('change',ev=>{
  const e=ev.target,m=S.months[cur];
  if(e.dataset.f){m[e.dataset.f]=num(e.value);if(e.dataset.f==='carry')m.carryAuto=false}
  else if(e.dataset.k){const p=e.dataset.p;
    const v=p==='name'?e.value:p==='day'?Math.max(0,Math.min(31,parseInt(e.value)||0)):p==='save'?e.checked:num(e.value);
    edit(e.dataset.k,e.dataset.id,x=>x[p]=v)}
  else if(e.dataset.s){
    if(e.dataset.s==='name')S.settings.name=e.value.trim();
    if(e.dataset.s==='startDay'){S.settings.startDay=Math.min(28,Math.max(1,parseInt(e.value)||16));cur=curKey();ensure(cur)}}
  else return;
  save();render();
});
render();
initCloud();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
